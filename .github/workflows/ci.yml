name: Zadanie 2

on:
    push:
        branches: ["main"]
        tags: ["v*"]

env:
    IMAGE_NAME: ${{ github.repository_owner }}/docker_zad2
    CACHE_IMAGE_NAME: ${{ github.repository_owner }}/docker_zad2-cache
    REGISTRY_DOCKERHUB: docker.io

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repo
              uses: actions/checkout@v6
            # Konfiguracja QEMU dla wsparcia wieloarchitekturalności (ARM64 i AMD64)
            - name: Set up QEMU
              uses: docker/setup-qemu-action@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Login to DockerHub
              uses: docker/login-action@v4
              with:
                  username: ${{ vars.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.REGISTRY_DOCKERHUB }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=semver,pattern={{version}}
                      type=sha,format=short
                      type=ref,event=branch
                      type=edge,branch=main

            - name: Build local image for testing
              uses: docker/build-push-action@v6
              with:
                  context: .
                  load: true # Ładuje obraz do lokalnego demona Dockera zamiast wysyłać do rejestru
                  tags: myapp:test
                  cache-from: type=registry,ref=${{ env.REGISTRY_DOCKERHUB }}/${{ env.CACHE_IMAGE_NAME }}:cache

            - name: Run Trivy vulnerability scanner
              uses: aquasecurity/trivy-action@master
              with:
                  image-ref: "myapp:test"
                  format: "table"
                  exit-code: "1" # Przerywa potok, jeśli zostaną znalezione zdefiniowane podatności
                  ignore-unfixed: true
                  severity: "CRITICAL,HIGH"

            - name: Build and push multi-arch image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  # Konfiguracja cache typu registry w trybie max
                  cache-from: type=registry,ref=${{ env.REGISTRY_DOCKERHUB }}/${{ env.CACHE_IMAGE_NAME }}:cache
                  cache-to: type=registry,ref=${{ env.REGISTRY_DOCKERHUB }}/${{ env.CACHE_IMAGE_NAME }}:cache,mode=max
